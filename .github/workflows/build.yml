name: Build Windows EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows binary
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-H windowsgui" -o salary_app.exe .
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: salary_app-windows
          path: salary_app.exe
